<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Medicine Reminder - Caretaker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #d7f0f7, #e3f7e8);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 30px 0;
        }
        .container-box {
            width: 92%;
            max-width: 1000px;
            margin: auto;
        }
        .card-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        h2 {
            font-weight: 600;
            color: #222;
        }
        .medicine-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .status {
            font-weight: 600;
        }
        .status-scheduled {
            color: #0d6efd;
        }
        .status-taken {
            color: #198754;
        }
        .status-missed {
            color: #dc3545;
        }
        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        .patient-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
        }
        .empty-message {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>
<body>

<button class="btn btn-outline-danger logout-btn" onclick="logoutUser()">
    Logout
</button>

<div class="container-box">

    <div class="card-box">
        <h2 class="text-center">👨‍⚕️ Caretaker Dashboard</h2>
        <p class="text-center text-muted" id="welcomeMessage"></p>
    </div>

    <div class="card-box">
        <h5>👤 Patient Information</h5>
        <div class="patient-info" id="patientInfo">
            Loading patient information...
        </div>
    </div>

    <div class="card-box">
        <h5 class="mb-3">💊 Schedule Medicine for Patient</h5>

        <form id="medicineForm">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Medicine Name</label>
                    <input
                        type="text"
                        id="medName"
                        class="form-control"
                        placeholder="Example: Paracetamol"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Dosage</label>
                    <input
                        type="text"
                        id="dosage"
                        class="form-control"
                        placeholder="Example: 1 Tablet"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Date</label>
                    <input
                        type="date"
                        id="medicineDate"
                        class="form-control"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Time</label>
                    <input
                        type="time"
                        id="medicineTime"
                        class="form-control"
                        required
                    >
                </div>

            </div>

            <button
                type="submit"
                class="btn btn-success w-100"
            >
                Schedule Medicine
            </button>

        </form>

        <div
            id="medicineMessage"
            class="alert mt-3"
            style="display:none;"
        ></div>
    </div>

    <div class="card-box">
        <h5 class="mb-3">📋 Patient's Medicines</h5>

        <div id="medicineList">
            <div class="empty-message">
                Loading medicines...
            </div>
        </div>
    </div>

</div>


<script src="js/caretaker.js"></script>

</body>
</html>
